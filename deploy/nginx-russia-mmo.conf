# RussiaEconomicMMO isolated beta. Exact HTTPS subpath.
location = /russia-mmo {
    return 308 /russia-mmo/;
}
location = /russia-mmo/ {
    default_type application/json;
    return 200 '{"project":"RussiaEconomicMMO","status":"beta-0.2","apk":"/russia-mmo/android.apk","api":"/russia-mmo/api/catalog"}';
}
location = /russia-mmo/android.apk {
    alias /var/www/rikagro-game/russia-mmo/android.apk;
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /russia-mmo/health {
    proxy_pass http://127.0.0.1:18783/health;
    proxy_read_timeout 10s;
}
location = /russia-mmo/api/register {
    limit_req zone=russia_mmo_auth burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 12k;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://127.0.0.1:18783/api/register;
    add_header Cache-Control "no-store" always;
}
location = /russia-mmo/api/login {
    limit_req zone=russia_mmo_auth burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 12k;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://127.0.0.1:18783/api/login;
    add_header Cache-Control "no-store" always;
}
location ^~ /russia-mmo/api/ {
    client_max_body_size 12k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:18783/api/;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
